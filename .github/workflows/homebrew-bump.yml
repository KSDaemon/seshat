name: Homebrew Bump

# Bump the formula in the public tap repo (KSDaemon/homebrew-seshat) after the
# `Release` workflow has built AND uploaded the platform tarballs, so `brew`
# can fetch them by URL.
#
# We trigger on the `Release` workflow *completing* (workflow_run), NOT on
# `release: published`. release-plz publishes the GitHub Release and pushes the
# `v*` tag in one shot — `release: published` fired this job ~10+ min before
# `Release` finished building/uploading the tarballs, so every download 404'd
# and the retry window expired. Gating on `Release` completion guarantees the
# assets exist before we render the formula.
#
# Trigger:
#   - Automatically after the `Release` workflow finishes successfully for a
#     `v*` tag (its tarballs are uploaded by then).
#   - Manually via workflow_dispatch (specify the tag), useful when
#     re-running after a tap-repo bootstrap fix or a failed auto-run.
#
# Required secrets (configure in repo Settings -> Secrets and variables -> Actions):
#   HOMEBREW_TAP_TOKEN  PAT with `repo` scope on KSDaemon/homebrew-seshat
#                       (a fine-grained token works too — must allow contents:write).
#
# If the secret is unset the job is skipped — this lets the rest of the
# release pipeline ship even before the tap repo exists.

on:
  # Fires when the `Release` workflow finishes (success OR failure — the job
  # `if` below filters to successful `v*` runs). This is the gate that makes
  # the tap bump wait for the binary tarballs to be uploaded.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump to (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

# Two releases published in quick succession (e.g. v0.1.2 then immediate
# hotfix v0.1.3) would otherwise race-clone, race-commit, and race-push
# to the same tap repo — the second run loses to a non-fast-forward and
# stays unbumped. Serialise.
concurrency:
  group: homebrew-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Update tap formula
    runs-on: ubuntu-latest
    # Auto path: only when the upstream `Release` run succeeded AND was for a
    # `v*` tag (workflow_run.head_branch is the tag name for tag-triggered runs;
    # a manual `Release` rerun on `main` has head_branch=main and is skipped —
    # use workflow_dispatch here for that case). Manual path: always allowed.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Resolve tag and version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # For a tag-triggered upstream run, head_branch holds the tag name
          # (e.g. "v0.4.0"). Routed through env + validated below (never
          # interpolated straight into a shell command).
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${RUN_TAG}"
          fi
          # Strict SemVer: v<MAJOR>.<MINOR>.<PATCH> with optional `-<pre-release>`.
          # No build-metadata `+meta` because GitHub URL-encodes `+` as `%2B`,
          # which breaks tarball downloads. Tightens the previous loose
          # `^v[0-9]` check that accepted shell-injectable values.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a valid SemVer release tag (expected v<MAJOR>.<MINOR>.<PATCH>[-<pre>])"
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if HOMEBREW_TAP_TOKEN secret is missing or invalid
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: KSDaemon/homebrew-seshat
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is unset — skipping tap update. See homebrew/README.md for bootstrap instructions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pre-validate the token by hitting the GitHub API for the tap
          # repo. Catches expired/revoked PATs and typo'd repo names with
          # a clean skip + actionable warning instead of a cryptic
          # `git clone` auth failure five steps later.
          if ! curl --fail --silent --show-error \
                -H "Authorization: token ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${TAP_REPO}" \
                > /dev/null
          then
            echo "::warning::HOMEBREW_TAP_TOKEN cannot read ${TAP_REPO} (revoked/expired/repo-misnamed). Skipping tap update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Surface skip in run summary
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::Tap not bumped (HOMEBREW_TAP_TOKEN missing or invalid)."

      - name: Verify release exists for the requested tag
        if: steps.gate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail-fast on workflow_dispatch typos before we burn minutes of
          # curl-and-retry waiting for an asset that will never exist. On the
          # workflow_run path the release already exists (the `Release` run we
          # gated on just uploaded to it), so this mainly guards the dispatch path.
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::No GitHub Release found for tag ${TAG} in ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Checkout source repo (for the formula template)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to checking out the default branch; pin to the
          # released tag so the rendered formula template matches that version.
          ref: ${{ steps.tag.outputs.tag }}

      - name: Download release tarballs and compute SHA256s
        if: steps.gate.outputs.skip == 'false'
        id: shasums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tarballs
          cd tarballs

          # We run after the `Release` workflow completed, so the tarballs are
          # uploaded — but GitHub's release-asset CDN can lag a few seconds
          # behind the upload API. Keep a short retry to ride out that
          # eventual-consistency window (no longer the ~10 min asset-build race).
          download_with_retry() {
            local url="$1"
            local out="$2"
            local attempts=6
            local delay=15
            for i in $(seq 1 "$attempts"); do
              if curl --fail --location --silent --show-error -o "$out" "$url"; then
                return 0
              fi
              if [[ "$i" -lt "$attempts" ]]; then
                echo "::notice::Asset not yet available (attempt ${i}/${attempts}): ${url} — retrying in ${delay}s"
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Failed to download ${url} after ${attempts} attempts"
            return 1
          }

          # Archive filenames carry the tag suffix after the target triple
          # (see release.yml — `seshat-<TARGET>-<TAG>.tar.gz`). x86_64-apple-darwin
          # is intentionally absent from the build matrix because the `ort` crate
          # no longer ships prebuilt Intel-Mac binaries; do not list it here.
          for triple in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu
          do
            file="seshat-${triple}-${TAG}.tar.gz"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}"
            echo "Downloading ${url}"
            download_with_retry "${url}" "${file}"
          done

          sha_darwin_arm64=$(sha256sum  "seshat-aarch64-apple-darwin-${TAG}.tar.gz"       | awk '{print $1}')
          sha_linux_arm64=$(sha256sum   "seshat-aarch64-unknown-linux-gnu-${TAG}.tar.gz"  | awk '{print $1}')
          sha_linux_x64=$(sha256sum     "seshat-x86_64-unknown-linux-gnu-${TAG}.tar.gz"   | awk '{print $1}')

          {
            echo "darwin_arm64=${sha_darwin_arm64}"
            echo "linux_arm64=${sha_linux_arm64}"
            echo "linux_x64=${sha_linux_x64}"
          } >> "$GITHUB_OUTPUT"

      - name: Render formula
        if: steps.gate.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.shasums.outputs.darwin_arm64 }}
          SHA_LINUX_ARM64: ${{ steps.shasums.outputs.linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.shasums.outputs.linux_x64 }}
        run: |
          set -euo pipefail
          mkdir -p rendered
          # Use sed with `|` separator so SHAs (lowercase hex) never contain it.
          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__SHA256_DARWIN_ARM64__|${SHA_DARWIN_ARM64}|g" \
            -e "s|__SHA256_LINUX_ARM64__|${SHA_LINUX_ARM64}|g" \
            -e "s|__SHA256_LINUX_X64__|${SHA_LINUX_X64}|g" \
            homebrew/seshat.rb > rendered/seshat.rb
          echo "--- Rendered formula ---"
          cat rendered/seshat.rb

      # Use actions/checkout for the tap clone instead of an inline `git
      # clone` with a custom `http.extraheader`. The previous approach
      # sent `Authorization: Bearer <PAT>`, which `api.github.com`
      # accepts but GitHub's git-over-HTTPS endpoint rejects — only
      # `Basic` auth works there — so every push attempt 401'd and git
      # fell back to a credential prompt with no TTY, exiting 128.
      # actions/checkout sets up the canonical `Basic` extraheader,
      # handles credential cleanup in its Post-step, and works for
      # both classic and fine-grained PATs.
      - name: Checkout tap repo
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: KSDaemon/homebrew-seshat
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          # Need full history to detect the actual default branch — a
          # depth=1 clone of a fresh tap may yield only HEAD with no
          # local branch ref for the bootstrap path below.
          fetch-depth: 0

      - name: Push rendered formula to tap repo
        if: steps.gate.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.name  "seshat-release-bot"
          git config --global user.email "seshat-release-bot@users.noreply.github.com"

          mkdir -p tap/Formula
          cp rendered/seshat.rb tap/Formula/seshat.rb

          cd tap

          # Handle the bootstrap case: a freshly-created tap repo has an
          # unborn HEAD (no commits yet). git status will report the new
          # formula as untracked; we need to create the initial branch
          # before we can commit/push.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Tap repo is empty — creating initial branch 'main'."
            git checkout -b main
            DEFAULT_BRANCH=main
          else
            DEFAULT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          fi

          # Stage first, then check the index against HEAD. The previous
          # `git diff --quiet -- Formula/seshat.rb` was structurally wrong:
          # for an untracked file (bootstrap or first-ever bump), the
          # working-tree-vs-HEAD comparison reports no diff and the script
          # exited 0 without committing. `git diff --cached --quiet` after
          # staging works for both untracked and tracked cases (and on the
          # unborn-HEAD branch it correctly reports the new file as added).
          git add Formula/seshat.rb
          if git diff --cached --quiet --exit-code; then
            echo "Formula already at version ${VERSION}; nothing to commit."
            exit 0
          fi

          git commit -m "seshat ${VERSION}"
          # actions/checkout's persisted Basic-auth extraheader is reused
          # transparently for the push — no inline token handling needed.
          git push --set-upstream origin "${DEFAULT_BRANCH}"
